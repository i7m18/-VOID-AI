name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - game/fps-military-prototype
    paths:
      - "fps-game/**"
      - ".github/workflows/build-fps-android.yml"

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot Android Debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install matching export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Install bundled Arabic UI font
        shell: bash
        run: |
          mkdir -p fps-game/fonts
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf' -o fps-game/fonts/NotoSansArabic.ttf
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/OFL.txt' -o fps-game/fonts/OFL.txt
          test -s fps-game/fonts/NotoSansArabic.ttf
          test -s fps-game/fonts/OFL.txt

      - name: Download CC0 city building models
        shell: bash
        run: |
          mkdir -p fps-game/assets/buildings
          for model in building-a building-b building-c building-d building-e building-f; do
            curl -L --fail --retry 3 "https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs/city-kit-commercial/${model}.glb" -o "fps-game/assets/buildings/${model}.glb"
            test -s "fps-game/assets/buildings/${model}.glb"
          done

      - name: Download CC0 weapon models
        shell: bash
        run: |
          mkdir -p fps-game/assets/weapons
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/weapons/flat_guns_west/Flat%20Guns%20West/GLB/Rifle_Assault_West.glb' -o fps-game/assets/weapons/assault_rifle.glb
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/weapons/flat_guns_west/Flat%20Guns%20West/GLB/SMG_Compact_West.glb' -o fps-game/assets/weapons/compact_smg.glb
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/weapons/flat_guns_west/Flat%20Guns%20West/GLB/Sniper_Material_West.glb' -o fps-game/assets/weapons/sniper_rifle.glb
          test -s fps-game/assets/weapons/assault_rifle.glb
          test -s fps-game/assets/weapons/compact_smg.glb
          test -s fps-game/assets/weapons/sniper_rifle.glb

      - name: Download CC0 soldier models and combat sound effects
        shell: bash
        run: |
          mkdir -p fps-game/assets/characters fps-game/assets/audio
          for model in character-male-a character-male-b character-male-c; do
            curl -L --fail --retry 3 "https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs/mini-characters/${model}.glb" -o "fps-game/assets/characters/${model}.glb"
            test -s "fps-game/assets/characters/${model}.glb"
          done
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/sfx/gunshots/game_gunshot.wav' -o fps-game/assets/audio/rifle_shot.wav
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/sfx/gunshots/sniper_shot.wav' -o fps-game/assets/audio/sniper_shot.wav
          test -s fps-game/assets/audio/rifle_shot.wav
          test -s fps-game/assets/audio/sniper_shot.wav

      - name: Configure Android debug signing and Godot SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          sed -i "s|^keystore/debug=\"\"$|keystore/debug=\"$HOME/.android/debug.keystore\"|" fps-game/export_presets.cfg
          sed -i 's|^keystore/debug_user=\"\"$|keystore/debug_user=\"androiddebugkey\"|' fps-game/export_presets.cfg
          sed -i 's|^keystore/debug_password=\"\"$|keystore/debug_password=\"android\"|' fps-game/export_presets.cfg
          grep -E "^keystore/debug" fps-game/export_presets.cfg

      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path fps-game --import 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi
          godot --headless --path fps-game --quit-after 3 2>&1 | tee /tmp/godot-run.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' /tmp/godot-run.log; then
            echo "Godot runtime validation reported script errors."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p fps-game/build
          godot --headless --verbose --path fps-game --export-debug "Android" build/VOID-FRONTLINE-debug.apk

      - name: Verify APK
        run: |
          test -s fps-game/build/VOID-FRONTLINE-debug.apk
          file fps-game/build/VOID-FRONTLINE-debug.apk
          unzip -t fps-game/build/VOID-FRONTLINE-debug.apk | tail -n 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-FRONTLINE-debug-APK
          path: fps-game/build/VOID-FRONTLINE-debug.apk
          if-no-files-found: error
          retention-days: 30
